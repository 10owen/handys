# 스테이메이트 — 3 컨테이너
#   docker compose up -d --build   →  http://localhost:8080  (앱)   http://localhost:8080/api/docs (API 문서)
#   db  : MySQL 8. 첫 기동 시 db/init/*.sql 로 스키마 + 시드(사전 계층) 자동 적재
#   api : FastAPI. 점수·학습·파생 테이블 재계산. SEED_DEMO=1 이면 첫 기동 시 데모 멤버·여행을 이벤트로 생성
#   web : nginx. 정적 앱 서빙 + /api 프록시
services:
  db:
    image: mysql:8.0
    container_name: staymate-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: staymate
      MYSQL_USER: staymate
      MYSQL_PASSWORD: staymate
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    container_name: staymate-api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: staymate
      DB_PASSWORD: staymate
      DB_NAME: staymate
      SEED_DEMO: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: staymate-web
    ports:
      - "8080:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
